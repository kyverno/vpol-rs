[package]
name = "vpol-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4"
flate2 = "1.1.11"
hex = "0.4.3"
k8s-openapi = { version = "0.29.0", features = ["latest"] }
kube = { version = "5.1.0", default-features = false, features = ["derive"] }
kube-cel = { git = "https://github.com/kube-rs/kube-cel", rev = "0312f42" }
md-5 = "0.11.0"
rand = "0.10.4"
rand_regex = "0.19.0"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
thiserror = "2.0.21"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
clap = { version = "4.6.9", features = ["derive"] }
serde_yaml_ng = "0.10.0"
ureq = { version = "3.5.2", features = ["platform-verifier"] }
x509-parser = "0.18.1"
num-bigint = "0.4"
base64 = "0.23.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
